name: Leaderboard Smoke Test

on:
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Submit a test entry (writes to production leaderboard)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run smoke test
        env:
          LEADERBOARD_API: https://stack-survive-leaderboard.azurewebsites.net
          SMOKE_MUTATE: ${{ inputs.mutate }}
          SMOKE_ORIGIN: https://yeongseon.dev
          SMOKE_REJECT_ORIGIN: https://example.invalid
        run: node scripts/smoke-leaderboard.mjs
