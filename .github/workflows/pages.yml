name: Deploy Pages demo
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Require the current main commit to have passed Quality
        id: current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.current.outputs.current == 'true'
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        if: steps.current.outputs.current == 'true'
        with:
          node-version: 22.22.0
          cache: pnpm
      - if: steps.current.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.current.outputs.current == 'true'
        run: pnpm check:assets:demo
      - if: steps.current.outputs.current == 'true'
        run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.current == 'true'
        with:
          path: apps/web/dist-pages
  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production demo
        id: deployment
        uses: actions/deploy-pages@v4
