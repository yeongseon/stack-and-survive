name: Work item format
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Validate body using trusted base-branch code
        env:
          ITEM_KIND: ${{ github.event.pull_request && 'pr' || 'issue' }}
        run: node scripts/check-work-item.mjs "$ITEM_KIND"
